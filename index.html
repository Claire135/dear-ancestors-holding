<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dear Ancestors — Something great is coming</title>
<meta name="description" content="Dear Ancestors is taking a pause while we build something better.">
<meta name="robots" content="noindex, follow">

<meta property="og:title" content="Dear Ancestors">
<meta property="og:description" content="Something great is coming.">
<meta property="og:url" content="https://www.dearancestors.com/">
<meta property="og:type" content="website">

<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">

<meta property="og:image" content="https://www.dearancestors.com/icon.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,600;1,400&family=Inter:wght@400;500&display=swap" rel="stylesheet">

<style>
  :root {
    --blue:      #2E5A6E;
    --blue-lift: #3F7C9A;
    --cream:     #FBF9F6;
    --ink:       #333333;
    --ink-soft:  #666666;
    --rule:      #A9A9A9;
  }

  * { box-sizing: border-box; }

  html, body { margin: 0; padding: 0; min-height: 100%; }

  body {
    background: linear-gradient(to bottom right, var(--cream), #ffffff);
    color: var(--ink);
    font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
    display: flex;
    flex-direction: column;
    min-height: 100vh;
  }

  main {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 4rem 1.5rem 3rem;
  }

  .card {
    width: 100%;
    max-width: 40rem;
    text-align: center;
  }

  .mark {
    width: 104px;
    height: auto;
    display: block;
    margin: 0 auto 2.5rem;
  }

  .eyebrow {
    font-size: .75rem;
    letter-spacing: .18em;
    text-transform: uppercase;
    color: var(--blue);
    font-weight: 500;
    margin: 0 0 1.25rem;
  }

  h1 {
    font-family: "Lora", Georgia, serif;
    font-weight: 600;
    font-size: clamp(2rem, 6vw, 3.25rem);
    line-height: 1.15;
    letter-spacing: -0.015em;
    margin: 0 0 1.5rem;
    color: var(--ink);
  }

  .lede {
    font-size: 1.125rem;
    line-height: 1.7;
    color: var(--ink-soft);
    max-width: 32rem;
    margin: 0 auto 1.25rem;
  }

  .divider {
    width: 4rem;
    height: 2px;
    background: var(--blue);
    border: 0;
    margin: 2.5rem auto;
  }

  .social {
    display: flex;
    justify-content: center;
    gap: 1.5rem;
    margin: 0 0 1rem;
  }
  .social a {
    color: var(--blue);
    border: 0;
    padding: .25rem;
    border-radius: 4px;
    display: inline-flex;
    transition: color .2s;
  }
  .social a:hover { color: var(--blue-lift); }
  .social svg { width: 22px; height: 22px; display: block; }

  .follow {
    font-size: .875rem;
    color: var(--ink-soft);
    margin: 0;
  }

  a {
    color: var(--blue);
    text-decoration: none;
    border-bottom: 1px solid rgba(46, 90, 110, .3);
    padding-bottom: 1px;
  }
  a:hover { color: var(--blue-lift); border-bottom-color: var(--blue-lift); }
  a:focus-visible {
    outline: 2px solid var(--blue);
    outline-offset: 3px;
    border-radius: 2px;
  }

  footer {
    border-top: 1px solid rgba(169, 169, 169, .35);
    padding: 1.5rem;
    text-align: center;
    font-size: .8125rem;
    color: var(--ink-soft);
  }
  .signature {
    font-family: "Lora", Georgia, serif;
    font-style: italic;
    font-size: 1.0625rem;
    color: var(--blue);
    display: block;
    margin-bottom: .5rem;
  }
</style>
</head>
<body>

<main>
  <div class="card">

    <img class="mark" src="icon.png" width="180" height="180" alt="Dear Ancestors">

    <p class="eyebrow">Dear Ancestors</p>

    <h1>Something great is coming</h1>

    <p class="lede">
      We've closed the doors for now while we work on the next chapter of Dear Ancestors —
      a quieter, simpler way to build your family story.
    </p>

    <hr class="divider">

    <div class="social">
      <a href="https://www.instagram.com/dearancestors_com/" target="_blank" rel="noopener" aria-label="Dear Ancestors on Instagram">

      </a>

        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M22.675 0h-21.35c-.732 0-1.325.593-1.325 1.325v21.351c0 .731.593 1.324 1.325 1.324h11.494v-9.294h-3.128v-3.622h3.128v-2.671c0-3.1 1.893-4.788 4.659-4.788 1.325 0 2.463.099 2.795.143v3.24l-1.918.001c-1.504 0-1.795.715-1.795 1.763v2.313h3.587l-.467 3.622h-3.12v9.294h6.116c.73 0 1.323-.593 1.323-1.325v-21.35c0-.732-.593-1.325-1.323-1.325z"/></svg>

    </div>

  </div>
</main>

<footer>
  © 2026 Dear Ancestors
</footer>

</body>
</html>
